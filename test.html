<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Student Registration Form</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 32px 16px;
			background: #f1f5f9;
			color: #1e293b;
			font-family: Arial, sans-serif;
		}

		main {
			max-width: 680px;
			margin: 0 auto;
			padding: 32px;
			background: #ffffff;
			border-radius: 12px;
			box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
		}

		h1 {
			margin: 0 0 8px;
			color: #1d4ed8;
			text-align: center;
		}

		.intro {
			margin: 0 0 28px;
			color: #64748b;
			text-align: center;
		}

		.form-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 18px;
		}

		.field {
			display: flex;
			flex-direction: column;
			gap: 7px;
		}

		.field.full-width {
			grid-column: 1 / -1;
		}

		label,
		legend {
			font-size: 14px;
			font-weight: 600;
		}

		input,
		select,
		textarea {
			width: 100%;
			padding: 11px 12px;
			border: 1px solid #cbd5e1;
			border-radius: 6px;
			background: #fff;
			color: inherit;
			font: inherit;
		}

		input:focus,
		select:focus,
		textarea:focus {
			border-color: #2563eb;
			outline: 3px solid rgba(37, 99, 235, 0.15);
		}

		textarea {
			min-height: 90px;
			resize: vertical;
		}

		fieldset {
			margin: 0;
			padding: 0;
			border: 0;
		}

		.radio-options {
			display: flex;
			flex-wrap: wrap;
			gap: 18px;
			margin-top: 10px;
		}

		.radio-options label {
			display: inline-flex;
			align-items: center;
			gap: 7px;
			font-weight: 400;
		}

		.radio-options input {
			width: auto;
			margin: 0;
		}

		.actions {
			display: flex;
			justify-content: flex-end;
			gap: 12px;
			margin-top: 26px;
		}

		button {
			padding: 11px 18px;
			border: 0;
			border-radius: 6px;
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}

		button[type="reset"] {
			background: #e2e8f0;
			color: #334155;
		}

		button[type="submit"] {
			background: #2563eb;
			color: #fff;
		}

		button[type="submit"]:hover {
			background: #1d4ed8;
		}

		@media (max-width: 520px) {
			main {
				padding: 24px 18px;
			}

			.form-grid {
				grid-template-columns: 1fr;
			}

			.field.full-width {
				grid-column: auto;
			}
		}
	</style>
</head>
<body>
	<main>
		<h1>Student Registration</h1>
		<p class="intro">Enter your details to register for a course.</p>

		<form action="#" method="post">
			<div class="form-grid">
				<div class="field">
					<label for="full-name">Full name</label>
					<input type="text" id="full-name" name="full_name" autocomplete="name" required>
				</div>

				<div class="field">
					<label for="date-of-birth">Date of birth</label>
					<input type="date" id="date-of-birth" name="date_of_birth" required>
				</div>

				<fieldset class="field full-width">
					<legend>Gender</legend>
					<div class="radio-options">
						<label><input type="radio" name="gender" value="female" required> Female</label>
						<label><input type="radio" name="gender" value="male"> Male</label>
						<label><input type="radio" name="gender" value="prefer-not-to-say"> Prefer not to say</label>
					</div>
				</fieldset>

				<div class="field">
					<label for="email">Email address</label>
					<input type="email" id="email" name="email" autocomplete="email" required>
				</div>

				<div class="field">
					<label for="phone">Phone number</label>
					<input type="tel" id="phone" name="phone" autocomplete="tel" required>
				</div>

				<div class="field">
					<label for="course">Course</label>
					<select id="course" name="course" required>
						<option value="">Select a course</option>
						<option value="computer-science">Computer Science</option>
						<option value="business">Business Administration</option>
						<option value="engineering">Engineering</option>
						<option value="arts">Arts and Humanities</option>
						<option value="science">Natural Sciences</option>
					</select>
				</div>

				<div class="field">
					<label for="year">Year of study</label>
					<select id="year" name="year" required>
						<option value="">Select a year</option>
						<option value="1">Year 1</option>
						<option value="2">Year 2</option>
						<option value="3">Year 3</option>
						<option value="4">Year 4</option>
					</select>
				</div>

				<div class="field full-width">
					<label for="address">Address</label>
					<textarea id="address" name="address" autocomplete="street-address" required></textarea>
				</div>
			</div>

			<div class="actions">
				<button type="reset">Clear form</button>
				<button type="submit">Register</button>
			</div>
		</form>
	</main>
</body>
</html>
